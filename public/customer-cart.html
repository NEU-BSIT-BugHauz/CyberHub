<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1224" />
  <title>CyberHub | My Cart</title>
  <link rel="stylesheet" href="/portal.css" />
  <link rel="stylesheet" href="/customer-auth.css" />
  <link rel="stylesheet" href="/customer-navigation.css" />
  <link rel="stylesheet" href="/customer-shopping.css" />
  <script defer src="/js/customer-auth.js"></script>
  <script defer src="/js/customer-shopping.js"></script>
</head>
<body class="portal-page" data-customer-page="cart">
  <header class="portal-header">
    <a class="portal-brand" href="/customer/dashboard"><span class="brand-logo">CH</span><span>CyberHub <small>Customer Portal</small></span></a>
    <nav class="top-navigation customer-nav" aria-label="Customer navigation">
        <a href="/customer/dashboard">Dashboard</a>
        <a href="/customer/shop">Shop Products</a>
        <a href="/customer/cart" aria-current="page">My Cart</a>
        <a href="/customer/checkout">Checkout</a>
        <a href="/customer/orders">My Orders</a>
        <a href="/customer/profile">My Profile</a>
      <button id="customer-logout" type="button" class="portal-button secondary">Sign out</button>
    </nav>
  </header>
  <main class="customer-shell customer-nav-page">
    <p class="choice-kicker">SAVED CART</p>
    <h1>My Cart</h1>
    <p id="customer-auth-message" class="customer-message" role="status" aria-live="polite"></p>
    <p class="customer-intro">Your products are saved to your account. Totals use the currently effective price and may change until checkout.</p>
    <p id="shopping-message" class="customer-shopping-message" role="status" aria-live="polite"></p>
    <section id="shopping-content" class="customer-shopping-panel" aria-label="My Cart details">
      <p>Loading…</p>
    </section>
    <div class="customer-shopping-actions">
      <button type="button" id="shopping-action" class="portal-button primary" disabled>Continue to checkout</button>
      <a class="portal-button secondary" href="/customer/shop">Keep shopping</a>
    </div>
  </main>
  <footer class="portal-footer">CyberHub · Customer Portal</footer>
</body>
</html>
