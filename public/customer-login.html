<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberHub | Customer Login</title>
  <link rel="stylesheet" href="/portal.css" />
  <link rel="stylesheet" href="/customer-auth.css" />
</head>
<body class="portal-page auth-page" data-customer-page="login">
  <header class="portal-header">
    <a class="portal-brand" href="/"><span class="brand-logo">CH</span><span>CyberHub <small>Customer Portal</small></span></a>
    <nav class="top-navigation"><a href="/">Home</a><a href="/staff/login">Employee login</a></nav>
  </header>
  <main class="auth-shell">
    <section class="portal-auth-card" aria-labelledby="customer-login-title">
      <div class="choice-icon" aria-hidden="true">🛍</div>
      <p class="choice-kicker">CUSTOMER ACCESS</p>
      <h1 id="customer-login-title">Welcome back</h1>
      <p class="auth-intro">Use your customer email and password. Employee accounts sign in separately.</p>
      <p id="customer-auth-message" class="customer-message" role="status" aria-live="polite"></p>
      <form id="customer-login-form">
        <label for="customer-email">Email address</label>
        <input id="customer-email" name="email" type="email" autocomplete="username" maxlength="190" required />
        <label for="customer-password">Password</label>
        <input id="customer-password" name="password" type="password" autocomplete="current-password" required />
        <button class="portal-button primary button-full" type="submit">Sign in</button>
      </form>
      <p class="auth-switch">New customer? <a href="/customer/register">Create a customer account</a></p>
      <p class="auth-switch">Staff member? <a href="/staff/login">Employee Login</a></p>
    </section>
  </main>
  <footer class="portal-footer">CyberHub · Customer Portal</footer>
  <script defer src="/js/customer-auth.js"></script>
</body>
</html>
